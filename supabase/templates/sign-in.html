<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#fffaf5;font-family:Arial,Helvetica,sans-serif;color:#2b2622">
    <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;padding:24px">
      <h1 style="font-size:20px;margin:0 0 16px">Sign in to GiftLedger</h1>
      <p style="font-size:16px;margin:0 0 8px">Your sign-in code:</p>
      <p style="font-size:32px;font-weight:bold;letter-spacing:6px;margin:0 0 20px">{{ .Token }}</p>
      <p style="font-size:16px;margin:0 0 20px">Type it on the sign-in screen, or tap the button:</p>
      <p style="margin:0 0 24px">
        <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&redirect_to={{ .RedirectTo }}"
           style="display:inline-block;background:#b4472f;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-size:16px">Sign in</a>
      </p>
      <p style="font-size:13px;color:#6b625b;margin:0">The code and button work once and expire in 1 hour. If you didn't ask to sign in, you can ignore this email.</p>
    </div>
  </body>
</html>
